services:
  - type: web
    name: picshare
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Скопируйте строку подключения из Neon.tech или Supabase:
      - key: DATABASE_URL
        sync: false
      # Необязательно: ключи Cloudinary для вечного бесплатного хранения картинок:
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
